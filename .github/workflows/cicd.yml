name: CI/CD Pipeline 12th sprint Exlaiv

on: push

jobs:
  # проверять код на наличие ошибок и запускать тесты
  job1_test:
    runs-on: ubuntu-latest
    container: golang:1.24
    steps:
      - uses: actions/checkout@v4

      - name: Download dependencies
        run: go mod download

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Vet
        run: go vet ./...

  # автоматически публиковать приложение в DockerHub
  job2_docker:
    name: Build and Push Docker image
    runs-on: ubuntu-latest
    needs: job1_test            # ← исправлено имя и отступ
    if: startsWith(github.ref, 'refs/tags')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/12th-sprint

      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}